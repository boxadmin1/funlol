<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roulette</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.game {
  width: 100%;
  max-width: 1100px;
  text-align: center;
}

h1 {
  font-size: 42px;
  margin: 0 0 8px;
}

.subtitle {
  color: #8f9bad;
  margin-bottom: 25px;
}

.balance {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: #111827;
  border: 1px solid #263247;
  border-radius: 12px;
  padding: 12px 25px;
  margin-bottom: 20px;
}

.balance span {
  color: #42e6a4;
  font-size: 25px;
  font-weight: bold;
}

.starting-balance {
  width: 100%;
  max-width: 500px;
  margin: 0 auto 25px;
  background: #111827;
  border: 1px solid #263247;
  border-radius: 14px;
  padding: 18px;
}

.starting-balance label {
  display: block;
  text-align: left;
  color: #aab5c7;
  font-size: 13px;
  margin-bottom: 10px;
}

.balance-input-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.balance-input-row span {
  font-size: 22px;
  color: #42e6a4;
  font-weight: bold;
}

.balance-input-row input {
  flex: 1;
  min-width: 0;
}

.balance-input-row button {
  background: #42e6a4;
  color: #06130d;
  border: none;
  border-radius: 8px;
  padding: 13px 16px;
  font-weight: bold;
  cursor: pointer;
}

.starting-balance-buttons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.starting-balance-buttons button {
  flex: 1;
  background: #1e293b;
  color: white;
  border: 1px solid #334155;
  border-radius: 7px;
  padding: 9px 4px;
  cursor: pointer;
}

.starting-balance-buttons button:hover {
  background: #334155;
}

.layout {
  display: flex;
  gap: 35px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
}

.wheel-area {
  position: relative;
  width: min(480px, 90vw);
}

canvas {
  width: 100%;
  height: auto;
  display: block;
}

.pointer {
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 18px solid transparent;
  border-right: 18px solid transparent;
  border-top: 35px solid #facc15;
  z-index: 5;
  filter: drop-shadow(0 2px 3px black);
}

.panel {
  width: 320px;
  background: #111827;
  border: 1px solid #263247;
  border-radius: 18px;
  padding: 25px;
  text-align: left;
}

.panel h2 {
  margin-top: 0;
  text-align: center;
}

label {
  display: block;
  color: #aab5c7;
  font-size: 13px;
  margin-bottom: 7px;
}

input {
  width: 100%;
  background: #080b12;
  border: 1px solid #334155;
  color: white;
  border-radius: 9px;
  padding: 13px;
  font-size: 16px;
  outline: none;
}

input:focus {
  border-color: #42e6a4;
}

.bet-buttons {
  display: flex;
  gap: 8px;
  margin: 12px 0 20px;
}

.bet-buttons button {
  flex: 1;
  background: #1e293b;
  color: white;
  border: 1px solid #334155;
  border-radius: 7px;
  padding: 9px;
  cursor: pointer;
}

.bet-buttons button:hover {
  background: #334155;
}

.color-buttons {
  display: flex;
  gap: 10px;
  margin: 10px 0 20px;
}

.color-btn {
  flex: 1;
  padding: 13px;
  border-radius: 8px;
  border: 2px solid transparent;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.red {
  background: #dc2626;
}

.black {
  background: #020617;
  border-color: #475569;
}

.green {
  background: #16a34a;
}

.color-btn.selected {
  border-color: #facc15;
  box-shadow: 0 0 12px #facc15;
}

.spin {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 10px;
  background: #42e6a4;
  color: #06130d;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.spin:hover {
  background: #65f0b8;
}

.spin:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.message {
  text-align: center;
  min-height: 25px;
  margin-top: 18px;
  font-weight: bold;
}

.reset {
  display: block;
  margin: 18px auto 0;
  background: transparent;
  color: #64748b;
  border: none;
  cursor: pointer;
}

.reset:hover {
  color: white;
}

.history {
  margin-top: 30px;
  color: #94a3b8;
  font-size: 14px;
}

.history span {
  display: inline-block;
  border-radius: 50%;
  width: 30px;
  height: 30px;
  line-height: 30px;
  margin: 3px;
  color: white;
  text-align: center;
}
</style>
</head>

<body>

<div class="game">

  <h1>🎰 Roulette</h1>
  <div class="subtitle">Virtual money roulette</div>

  <div class="balance">
    Balance: <span id="balance">$1,000.00</span>
  </div>

  <div class="starting-balance">
    <label>Starting Balance</label>

    <div class="balance-input-row">
      <span>$</span>
      <input
        id="startingBalanceInput"
        type="number"
        min="0"
        step="0.01"
        value="1000"
      >
      <button onclick="setStartingBalance()">Set Balance</button>
    </div>

    <div class="starting-balance-buttons">
      <button onclick="setStartingAmount(100)">100</button>
      <button onclick="setStartingAmount(1000)">1,000</button>
      <button onclick="setStartingAmount(10000)">10,000</button>
      <button onclick="setStartingAmount(100000)">100,000</button>
    </div>
  </div>

  <div class="layout">

    <div class="wheel-area">
      <div class="pointer"></div>
      <canvas id="wheel" width="500" height="500"></canvas>
    </div>

    <div class="panel">

      <h2>Place Your Bet</h2>

      <label>Bet Amount</label>
      <input
        id="betAmount"
        type="number"
        min="1"
        step="0.01"
        value="10"
      >

      <div class="bet-buttons">
        <button onclick="setBet(1)">$1</button>
        <button onclick="setBet(10)">$10</button>
        <button onclick="setBet(50)">$50</button>
        <button onclick="setBet(100)">$100</button>
      </div>

      <label>Choose Color</label>

      <div class="color-buttons">
        <button class="color-btn red" onclick="selectColor('red')">
          RED
        </button>

        <button class="color-btn black" onclick="selectColor('black')">
          BLACK
        </button>

        <button class="color-btn green" onclick="selectColor('green')">
          GREEN
        </button>
      </div>

      <button class="spin" id="spinButton" onclick="spin()">
        SPIN WHEEL
      </button>

      <div class="message" id="message">
        Choose a color and spin!
      </div>

      <button class="reset" onclick="resetGame()">
        Reset Balance
      </button>

    </div>

  </div>

  <div class="history">
    Recent Results:
    <div id="history"></div>
  </div>

</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const balanceEl = document.getElementById("balance");
const betInput = document.getElementById("betAmount");
const messageEl = document.getElementById("message");
const spinButton = document.getElementById("spinButton");
const historyEl = document.getElementById("history");

let balance = 1000;
let selectedColor = null;
let rotation = 0;
let spinning = false;

// European roulette wheel
const numbers = [
  0, 32, 15, 19, 4, 21, 2, 25, 17, 34,
  6, 27, 13, 36, 11, 30, 8, 23, 10, 5,
  24, 16, 33, 1, 20, 14, 31, 9, 22, 18,
  29, 7, 28, 12, 35, 3, 26
];

const redNumbers = new Set([
  1,3,5,7,9,12,14,16,18,
  19,21,23,25,27,30,32,34,36
]);

const colors = numbers.map(n =>
  n === 0 ? "#16a34a" :
  redNumbers.has(n) ? "#dc2626" : "#020617"
);

function drawWheel() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const radius = 235;
  const slice = (Math.PI * 2) / numbers.length;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);

  for (let i = 0; i < numbers.length; i++) {
    const start = i * slice - Math.PI / 2;
    const end = start + slice;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, start, end);
    ctx.closePath();

    ctx.fillStyle = colors[i];
    ctx.fill();

    ctx.strokeStyle = "#facc15";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.save();
    ctx.rotate(start + slice / 2);
    ctx.translate(radius * 0.82, 0);
    ctx.rotate(Math.PI / 2);

    ctx.fillStyle = "white";
    ctx.font = "bold 15px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(numbers[i], 0, 0);

    ctx.restore();
  }

  ctx.restore();

  // Center
  ctx.beginPath();
  ctx.arc(cx, cy, 55, 0, Math.PI * 2);
  ctx.fillStyle = "#111827";
  ctx.fill();
  ctx.strokeStyle = "#facc15";
  ctx.lineWidth = 4;
  ctx.stroke();

  ctx.fillStyle = "#facc15";
  ctx.font = "bold 18px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("ROULETTE", cx, cy);

  // Outer ring
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.strokeStyle = "#facc15";
  ctx.lineWidth = 8;
  ctx.stroke();
}

function updateBalance() {
  balanceEl.textContent =
    "$" + balance.toLocaleString("en-US", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
}

function setBet(amount) {
  betInput.value = amount;
}

function setStartingAmount(amount) {
  document.getElementById("startingBalanceInput").value = amount;
}

function setStartingBalance() {
  if (spinning) return;

  const input = document.getElementById("startingBalanceInput");
  const newBalance = parseFloat(input.value);

  if (isNaN(newBalance) || newBalance < 0) {
    messageEl.textContent = "Enter a valid starting balance!";
    return;
  }

  balance = newBalance;
  updateBalance();

  messageEl.textContent =
    `Starting balance set to $${newBalance.toFixed(2)}!`;
}

function selectColor(color) {
  selectedColor = color;

  document.querySelectorAll(".color-btn").forEach(btn => {
    btn.classList.remove("selected");
  });

  document.querySelector("." + color).classList.add("selected");
}

function getColor(number) {
  if (number === 0) return "green";
  return redNumbers.has(number) ? "red" : "black";
}

function spin() {
  if (spinning) return;

  const bet = parseFloat(betInput.value);

  if (!selectedColor) {
    messageEl.textContent = "Choose a color first!";
    return;
  }

  if (!bet || bet <= 0) {
    messageEl.textContent = "Enter a valid bet amount!";
    return;
  }

  if (bet > balance) {
    messageEl.textContent = "You don't have enough virtual money!";
    return;
  }

  spinning = true;
  spinButton.disabled = true;

  balance -= bet;
  updateBalance();

  messageEl.textContent = "Spinning...";

  // NEW RANDOM RESULT EVERY SPIN
  const winningIndex =
    Math.floor(Math.random() * numbers.length);

  const winningNumber = numbers[winningIndex];

  const slice = (Math.PI * 2) / numbers.length;

  // The pointer is at the TOP of the wheel.
  // This calculates the exact rotation needed
  // to put the randomly selected number under it.
  const targetAngle =
    -(winningIndex * slice + slice / 2);

  // Always spin forward.
  // Add a random number of full rotations.
  const extraSpins =
    5 + Math.floor(Math.random() * 4);

  const currentRotation = rotation;

  // Normalize the target so it is ahead of the current wheel position.
  const twoPi = Math.PI * 2;

  let targetRotation =
    targetAngle + extraSpins * twoPi;

  while (targetRotation <= currentRotation) {
    targetRotation += twoPi;
  }

  const startRotation = rotation;
  const finalRotation = targetRotation;

  const duration = 4500;
  const startTime = performance.now();

  function animate(time) {
    const progress = Math.min(
      (time - startTime) / duration,
      1
    );

    // Smooth deceleration
    const eased = 1 - Math.pow(1 - progress, 4);

    rotation =
      startRotation +
      (finalRotation - startRotation) * eased;

    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      rotation = finalRotation;
      finishSpin(winningNumber, bet);
    }
  }

  requestAnimationFrame(animate);
}

function finishSpin(number, bet) {
  const resultColor = getColor(number);

  let winnings = 0;

  if (resultColor === selectedColor) {
    if (resultColor === "green") {
      winnings = bet * 14;
    } else {
      winnings = bet * 2;
    }

    balance += winnings;

    messageEl.textContent =
      `🎉 ${number} ${resultColor.toUpperCase()} — You won $${winnings.toFixed(2)}!`;
  } else {
    messageEl.textContent =
      `Result: ${number} ${resultColor.toUpperCase()} — You lost $${bet.toFixed(2)}.`;
  }

  updateBalance();
  addHistory(number, resultColor);

  spinning = false;
  spinButton.disabled = false;
}

function addHistory(number, color) {
  const span = document.createElement("span");

  span.textContent = number;
  span.style.background =
    color === "red" ? "#dc2626" :
    color === "green" ? "#16a34a" : "#020617";

  historyEl.prepend(span);

  if (historyEl.children.length > 10) {
    historyEl.lastChild.remove();
  }
}

function resetGame() {
  balance = 1000;
  selectedColor = null;
  rotation = 0;
  spinning = false;

  historyEl.innerHTML = "";
  messageEl.textContent = "Choose a color and spin!";

  document.querySelectorAll(".color-btn").forEach(btn => {
    btn.classList.remove("selected");
  });

  updateBalance();
  drawWheel();
}

drawWheel();
updateBalance();
</script>

</body>
</html>
